name: Release

# 打一个 v 开头的标签（例如 v0.01）就会走这里：压缩包名字、exe 里的版本号和 Release
# 的标题都从标签来，只有一个地方要改。也可以在 Actions 页面手动运行，填一个版本号。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 0.01
        required: true
        default: "0.01"
        type: string

# 建 Release 要写权限；仓库若把 Actions 的默认权限设成只读，需要在
# Settings → Actions → General → Workflow permissions 里放开，否则这一步会被拒。
permissions:
  contents: write

jobs:
  package:
    # WhaleGenie 要在真实 Windows 桌面上跑，包只能在 Windows 上打。
    runs-on: windows-latest
    # 标签在下面算一次，交给 release 那一步用（两个 job 不共享步骤，只能这样传）。
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        # 只发 64 位：找图找色用的 OpenCV 和浏览器动作用的 Playwright 驱动都只有 64 位一份。
        rid: [win-x64]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: 算出版本号
        id: version
        shell: pwsh
        run: |
          # 手动运行时拿到的是人填的版本号，标签推送时拿到的是标签本身。两者都可能是
          # "v0.01" / "V0.01" / "0.01" —— 前面那层 v 只是标签的样子，先剥掉一层再统一
          # 补一个小写的 v，免得填了个大写的 V 就得到 "vV0.0.2" 这种标签。
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ inputs.version }}' }
          $version = $name -replace '^[vV]', ''

          # 版本号原样进 dotnet 的 -p:Version。喂进去一个不像版本号的东西（比如带了一层
          # v、或者有中文），NuGet 还原会当场失败，而 MSBuild 只报一句 "RestoreTask 返回
          # false but did not log an error"，看不出是哪一步的错 —— 所以在这里先挡下来。
          if ($version -notmatch '^\d+(\.\d+){0,3}(-[0-9A-Za-z.]+)?$') {
            throw "版本号 '$name' 不像版本号，写成 0.01 或 1.2.3 这样的数字。"
          }

          # 标签推送时用的是推上来的那个标签，不替用户改名；手动运行时才现造一个。
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $name } else { "v$version" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      # 两种包，差别只在"要不要自己带运行环境"：
      #   框架依赖 —— 最小，机器上装过 .NET 桌面运行时就用它；
      #   自带运行时 —— 不用装任何东西，解压即用，适合换机器、给别人。
      # 包装成什么样、exe 和 dll 怎么分，都写在 build/package.ps1 里，本地发版走的也是它。
      - name: 打包
        run: >-
          pwsh build/package.ps1
          -Tag "${{ steps.version.outputs.tag }}"
          -Version "${{ steps.version.outputs.version }}"
          -Rid ${{ matrix.rid }}

      - uses: actions/upload-artifact@v6
        with:
          name: WhaleGenie-${{ matrix.rid }}
          path: |
            dist/WhaleGenie-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.zip
            dist/WhaleGenie-${{ steps.version.outputs.tag }}-${{ matrix.rid }}-standalone.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest

    steps:
      # 发布说明是仓库里的一份文件，所以这里也要先取下来。
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true

      - name: 把包放进 Release
        # 已经发过的话补传一次即可，重跑不会因为"Release 已存在"而失败。
        env:
          GH_TOKEN: ${{ github.token }}
          # 标签只在上面的 package 里算一次，这里直接用结果，免得两处各算各的、算法一改就分叉。
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/*.zip --clobber
          else
            gh release create "$TAG" packages/*.zip \
              --title "WhaleGenie $TAG" \
              --notes-file .github/release-notes.md
          fi
