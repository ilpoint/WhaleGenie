name: Release

# 打一个 v 开头的标签（例如 v0.01）就会走这里：压缩包名字、exe 里的版本号和 Release
# 的标题都从标签来，只有一个地方要改。也可以在 Actions 页面手动运行，填一个版本号。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 0.01
        required: true
        default: "0.01"
        type: string

# 建 Release 要写权限；仓库若把 Actions 的默认权限设成只读，需要在
# Settings → Actions → General → Workflow permissions 里放开，否则这一步会被拒。
permissions:
  contents: write

jobs:
  package:
    # Viktor 要在真实 Windows 桌面上跑，包只能在 Windows 上打。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 算出版本号
        id: version
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v${{ inputs.version }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag -replace '^v','')" >> $env:GITHUB_OUTPUT

      # 三种包都要，因为"要不要自己带运行环境"是使用者的事，不是我们替他定的事：
      #   框架依赖 —— 最小，机器上本来就有 .NET 桌面运行时时最省事；
      #   自带运行时（文件夹） —— 不用装任何东西，解压即用，适合换机器、给别人；
      #   自带运行时（单文件） —— 拷一个 exe 就能走，代价是第一次启动会解压原生库。
      # 不想要哪一种，把对应那一段和下面的文件名删掉即可。
      - name: 打包（框架依赖）
        run: >
          dotnet publish Viktor/Viktor.csproj -c Release -r ${{ matrix.rid }}
          --self-contained false -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }} -o dist/framework

      - name: 打包（自带运行时，文件夹）
        run: >
          dotnet publish Viktor/Viktor.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }} -o dist/folder

      - name: 打包（自带运行时，单文件）
        run: >
          dotnet publish Viktor/Viktor.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:DebugType=none -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }} -o dist/single

      - name: 起名并压包
        id: zip
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $rid = "${{ matrix.rid }}"
          Get-ChildItem dist -Recurse -Filter *.pdb | Remove-Item   # 调试符号，用户不需要
          Compress-Archive -Path dist/framework/* -DestinationPath "Viktor-$tag-$rid.zip"
          Compress-Archive -Path dist/folder/* -DestinationPath "Viktor-$tag-$rid-standalone.zip"
          Move-Item dist/single/Viktor.exe "Viktor-$tag-$rid-standalone.exe"
          Get-ChildItem "Viktor-$tag-$rid*" | ForEach-Object { $_.Name }

      - uses: actions/upload-artifact@v4
        with:
          name: Viktor-${{ matrix.rid }}
          path: |
            Viktor-${{ steps.version.outputs.tag }}-${{ matrix.rid }}.zip
            Viktor-${{ steps.version.outputs.tag }}-${{ matrix.rid }}-standalone.zip
            Viktor-${{ steps.version.outputs.tag }}-${{ matrix.rid }}-standalone.exe
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest

    steps:
      # 发布说明是仓库里的一份文件，所以这里也要先取下来。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: 算出版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v${{ inputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 把包放进 Release
        # 已经发过的话补传一次即可，重跑不会因为"Release 已存在"而失败。
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/*.zip packages/*.exe --clobber
          else
            gh release create "$TAG" packages/*.zip packages/*.exe \
              --title "Viktor $TAG" \
              --notes-file .github/release-notes.md
          fi
