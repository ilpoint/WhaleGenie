name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # WhaleGenie drives the real Windows desktop: SharpHook for input, UI Automation for
    # elements, OpenCV and PaddleOCR for the screen. It only builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        # The web shell builds through npm before the interface project compiles; the runner
        # ships Node but pinning keeps the toolchain the same as the lockfile expects.
        if: env.ACT != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - uses: actions/setup-dotnet@v5
        # act runs on this Windows host rather than a clean runner. The host already has the
        # SDK selected by global.json; the action would otherwise try to write Program Files.
        if: env.ACT != 'true'
        with:
          global-json-file: global.json

      - name: Build the web shell
        # Lint and unit tests first so a broken page fails fast; the dotnet build below would
        # run the same npm build again, which is incremental and skips it when nothing changed.
        run: |
          cd webui
          npm ci --no-audit --no-fund
          npm run lint
          npm run test
          npm run build

      - name: Run the web e2e
        # The shell's end-to-end smoke runs on the runner's Edge against the build the step
        # above produced; it stays out of npm run check so that loop stays quick.
        run: |
          cd webui
          npm run e2e

      - name: Restore
        run: dotnet restore WhaleGenie.slnx

      - name: Check formatting
        run: dotnet format WhaleGenie.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build WhaleGenie.slnx -c Release --no-restore

      - name: Test
        # The suites run side by side: six of them mostly wait on a window session or on a real
        # device, and one project at a time spent a minute and a half waiting for another to finish.
        # Measured on this machine, two runs: 5m42 and 6m28 side by side, against 7m one at a time.
        # WhaleGenie.TestSupport and WhaleGenie.App.TestSupport are libraries, not suites, and say
        # so themselves, so the solution lists them without a run of their own.
        run: dotnet test WhaleGenie.slnx -c Release --no-build --no-restore --logger "trx;LogFileName=results.trx"

      - name: Keep the test report
        # act cannot use GitHub's artifact service; its bundled server rejects upload-artifact v6.
        # Local runs set ACT=true so the quality gates above are the whole job. A successful run
        # needs no report, and seven days is enough to read one from a failed run.
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7
