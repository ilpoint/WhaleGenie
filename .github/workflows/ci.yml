name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # WhaleGenie drives the real Windows desktop: SharpHook for input, UI Automation for
    # elements, OpenCV and PaddleOCR for the screen. It only builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        # act runs on this Windows host rather than a clean runner. The host already has the
        # SDK selected by global.json; the action would otherwise try to write Program Files.
        if: env.ACT != 'true'
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore WhaleGenie.slnx

      - name: Check formatting
        run: dotnet format WhaleGenie.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build WhaleGenie.slnx -c Release --no-restore

      - name: Test
        # One project at a time. The three suites otherwise run side by side on a runner with four
        # cores, and a check that reads how long a wait took then fails over another suite's CPU
        # time rather than over anything the engine did.
        run: dotnet test WhaleGenie.slnx -c Release --no-build --no-restore -m:1 --logger "trx;LogFileName=results.trx"

      - name: Keep the test report
        # act cannot use GitHub's artifact service; its bundled server rejects upload-artifact v6.
        # Local runs set ACT=true so the quality gates above are the whole job. A successful run
        # needs no report, and seven days is enough to read one from a failed run.
        if: failure() && env.ACT != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7
