<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>鲸灵 · 找色动作族 · 编辑页样板</title>
<style>
:root{
  --win:#1C1C1C; --chrome:#232323; --sunken:#1E1E1E; --panel:#262626;
  --field:#2A2A2A; --card:#2E2E2E; --flyout:#363636; --hover:#383838;
  --text:#F2F2F2; --text2:#B8B8B8; --text3:#A8A8A8; --disabled:#6E6E6E;
  --line:#303030; --line2:#555555;
  --accent:#C8401C; --accentH:#CE4822; --accentT:#FF7A50; --accentS:#3A2118;
  --ok:#7FC97F; --okS:#1D3324; --warn:#E0A060; --warnS:#3A2C15;
  --bad:#F07A84; --badS:#3A2024; --info:#8FB3D9; --infoS:#1F2C3A;
  --mono:"Cascadia Mono","Consolas",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#141414; color:var(--text);
  font:13px/1.55 "Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3A3A3A;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#4A4A4A;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶部 ---------- */
.topbar{
  height:46px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:var(--chrome);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.2px}
.brand .drop{width:15px;height:19px;background:linear-gradient(180deg,#6FB4E8,#2C6FA8);
  border-radius:60% 60% 60% 60%/70% 70% 40% 40%;flex:none}
.topbar .sub{font-size:12px;color:var(--text3)}
.topbar .spacer{flex:1}
.seg{display:flex;background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{padding:4px 12px;font-size:12px;color:var(--text2);border-radius:5px}
.seg button[aria-selected="true"]{background:var(--accentS);color:var(--accentT);
  box-shadow:inset 0 0 0 1px var(--accent)}

/* ---------- 布局 ---------- */
.shell{display:flex;align-items:flex-start;gap:0;height:calc(100% - 46px)}

/* 左：动作列表 */
.rail{
  width:200px;flex:none;height:100%;overflow:auto;padding:14px 10px 24px;
  border-right:1px solid var(--line);background:#171717;
}
.rail h4{margin:0 0 8px;padding:0 6px;font-size:11px;font-weight:600;
  letter-spacing:.6px;color:var(--text3);text-transform:uppercase}
.rail .item{
  display:block;width:100%;text-align:left;padding:7px 9px;border-radius:6px;
  margin-bottom:2px;border:1px solid transparent;
}
.rail .item:hover{background:var(--hover)}
.rail .item[aria-current="true"]{background:var(--accentS);border-color:var(--accent)}
.rail .item .n{font-size:13px;color:var(--text)}
.rail .item[aria-current="true"] .n{color:var(--accentT);font-weight:600}
.rail .item .k{display:block;font-size:11px;color:var(--disabled);font-family:var(--mono);margin-top:1px}
.rail .new{display:inline-block;margin-left:5px;padding:0 5px;border-radius:9px;
  font-size:10px;line-height:15px;background:var(--okS);color:var(--ok);vertical-align:1px}
.rail .gone .n{color:var(--disabled);text-decoration:line-through}
.rail .split{height:1px;background:var(--line);margin:10px 4px}

/* 中：弹窗 */
.stage{flex:1;min-width:0;height:100%;overflow:auto;padding:22px 20px 40px;
  display:flex;justify-content:center;align-items:flex-start;background:
   radial-gradient(700px 400px at 50% 0%,#1B1B1B 0%,#141414 70%)}

.dlg{
  width:min(1000px,100%);background:var(--win);border:1px solid #2C2C2C;
  border-radius:8px;box-shadow:0 22px 60px rgba(0,0,0,.55);overflow:hidden;
  display:flex;flex-direction:column;min-height:560px;
}
.titlebar{
  height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;
  background:var(--chrome);font-size:12px;color:var(--text2);
}
.titlebar .drop{width:11px;height:14px;background:linear-gradient(180deg,#6FB4E8,#2C6FA8);
  border-radius:60% 60% 60% 60%/70% 70% 40% 40%}
.titlebar .spacer{flex:1}
.wbtn{width:44px;height:34px;display:grid;place-items:center;color:var(--text2);font-size:10px}
.wbtn:hover{background:var(--hover)}
.wbtn.close:hover{background:#C42B1C;color:#fff}

.dlgbody{padding:20px 26px 10px;display:flex;flex-direction:column;flex:1;min-height:0}
h1{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:.2px;display:flex;
  align-items:center;gap:10px}
h1 .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:.2px}
.tag.coord{background:var(--infoS);color:var(--info)}
.tag.bool{background:var(--okS);color:var(--ok)}
.tag.read{background:#2C2C2C;color:var(--text2)}
.tag.wait{background:var(--warnS);color:var(--warn)}
.desc{margin:0 0 14px;font-size:12.5px;color:var(--text3);max-width:74ch}

.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:5px 14px;border-radius:6px;font-size:12.5px;color:var(--text2);
  border:1px solid transparent}
.tab:hover{background:var(--hover)}
.tab[aria-selected="true"]{background:var(--accentS);border-color:var(--accent);color:var(--accentT)}
.tab .cnt{display:none;margin-left:6px;padding:0 5px;border-radius:8px;font-size:10px;
  background:var(--infoS);color:var(--info);vertical-align:1px}
.tab .cnt.on{display:inline-block}

/* 分组小标题 */
.subhead{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
.subhead:first-child{margin-top:6px}
.subhead h4{margin:0;font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.3px}
.subhead .line{flex:1;height:1px;background:#2B2B2B}
.subhead .scope{font-size:10.5px;color:var(--disabled);padding:1px 7px;border-radius:8px;
  border:1px solid #333}

/* 失败策略单选卡 */
.choices{display:grid;gap:6px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:9px 11px;
  border-radius:6px;border:1px solid #3A3A3A;background:#232323}
.choice:hover{border-color:#4A4A4A;background:#262626}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accentS)}
.choice .rad{width:14px;height:14px;border-radius:50%;border:1.5px solid #666;flex:none;margin-top:2px}
.choice[aria-pressed="true"] .rad{border-color:var(--accentT);box-shadow:inset 0 0 0 3px var(--accentT)}
.choice .cbody{min-width:0}
.choice .cbody b{display:block;font-size:12.5px;font-weight:600;color:var(--text)}
.choice[aria-pressed="true"] .cbody b{color:var(--accentT)}
.choice .cbody i{display:block;font-style:normal;font-size:11.5px;color:var(--text3);
  line-height:1.55;margin-top:2px}
.choice.danger[aria-pressed="true"]{border-color:var(--bad);background:var(--badS)}
.choice.danger[aria-pressed="true"] .cbody b{color:var(--bad)}
.choice.danger[aria-pressed="true"] .rad{border-color:var(--bad);box-shadow:inset 0 0 0 3px var(--bad)}

.plan{margin-top:8px;padding:7px 10px;border-radius:5px;background:#1F1F1F;
  border:1px solid #2E2E2E;font-size:11.5px;color:var(--text2);font-family:var(--mono)}
.plan.idle{font-family:inherit;color:var(--text3)}
.warnline{margin-top:8px;padding:7px 10px;border-radius:5px;background:var(--warnS);
  border:1px solid #4A3A1C;font-size:11.5px;color:#E8C79E;line-height:1.6}

.panel{background:#222;border:1px solid var(--line);border-radius:8px;
  padding:4px 18px 18px;flex:1;min-height:0;overflow:auto}

/* 字段块 */
.blk{padding:15px 0 3px;border-bottom:1px solid #2B2B2B}
.blk:last-child{border-bottom:none}
.blk-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.blk-num{width:19px;height:19px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;font-family:var(--mono);background:#2E2E2E;color:var(--text2);
  border:1px solid #3A3A3A}
.blk-head h3{margin:0;font-size:12.5px;font-weight:600;color:var(--text)}
.blk-head .aside{margin-left:auto;font-size:11.5px;color:var(--text3)}
.lbl{font-size:12.5px;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.lbl .fx{font-family:var(--mono);font-size:11px;color:var(--accentT);font-style:italic}
.lbl .opt{font-size:11px;color:var(--disabled)}
.hint{margin:6px 0 0;font-size:11.5px;line-height:1.6;color:var(--text3)}
.hint code{font-family:var(--mono);font-size:11px;color:var(--text2);
  background:#2A2A2A;padding:0 4px;border-radius:3px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}

.inp{background:var(--field);border:1px solid var(--line2);border-radius:4px;
  height:32px;padding:0 9px;width:100%;outline:none;color:var(--text)}
.inp:focus{border-color:var(--accent)}
.inp.num{font-family:var(--mono);font-size:12.5px;text-align:center;padding:0 4px}
.inp.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.4px}
select.inp{appearance:none;padding-right:24px;
  background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);
  background-position:calc(100% - 13px) 14px,calc(100% - 8px) 14px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.btn{background:var(--field);border:1px solid var(--line2);border-radius:4px;
  height:32px;padding:0 11px;font-size:12.5px;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
.btn.ghost{background:transparent;border-color:#3C3C3C;color:var(--text2)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accentH)}
.btn.icon{width:33px;padding:0;display:grid;place-items:center;flex:none}
.btn.chip{height:28px;padding:0 10px;font-size:11.5px;border-radius:14px}

/* 基准分段 */
.modes{display:flex;gap:6px}
.modes button{height:30px;padding:0 13px;border-radius:5px;font-size:12.5px;
  border:1px solid #3C3C3C;background:var(--field);color:var(--text2)}
.modes button[aria-pressed="true"]{border-color:var(--accent);background:var(--accentS);color:var(--accentT)}

/* 颜色输入 */
.colorline{display:flex;gap:8px;align-items:center}
.swatch{width:32px;height:32px;border-radius:5px;flex:none;border:1px solid var(--line2);
  background:#E04A3F}
.hex{width:112px;flex:none}

/* 容差 */
.tol{display:flex;align-items:center;gap:12px;margin-top:9px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:#3A3A3A;flex:1;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--accentT);border:2px solid var(--win);cursor:pointer}
.tolv{font-family:var(--mono);font-size:12.5px;color:var(--text);width:44px;text-align:right}
.tolx{font-size:11.5px;color:var(--text3);white-space:nowrap}

/* 区域数字行 */
.region{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px}
.rfield{position:relative}
.rfield span{position:absolute;left:8px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--disabled);pointer-events:none;font-family:var(--mono)}
.rfield input{padding-left:26px;text-align:left;font-family:var(--mono);font-size:12.5px}

/* 结果行 */
.res{display:grid;grid-template-columns:22px 96px 1fr auto;gap:9px;align-items:center;
  padding:6px 0;border-bottom:1px solid #2B2B2B}
.res:last-child{border-bottom:none}
.res input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);margin:0}
.res .rn{font-family:var(--mono);font-size:12px;color:var(--text)}
.res .rv{font-size:11.5px;color:var(--text3)}
.res .rv b{font-family:var(--mono);color:var(--text2);font-weight:400}
.res .kind{font-size:10.5px;padding:1px 6px;border-radius:8px;background:#2C2C2C;color:var(--text3)}

/* 偏移点表 */
.pttable{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#202020}
.ptrow{display:grid;grid-template-columns:26px 66px 66px 1fr 72px 86px 26px;
  gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid #2B2B2B}
.ptrow:last-child{border-bottom:none}
.pthead{background:#252525;font-size:10.5px;color:var(--text3);letter-spacing:.4px;
  padding:5px 8px}
.pthead div{text-align:center}
.ptrow .idx{font-family:var(--mono);font-size:11px;color:var(--disabled);text-align:center}
.ptrow .num{width:100%;height:28px;background:var(--field);border:1px solid #3C3C3C;
  border-radius:4px;text-align:center;font-family:var(--mono);font-size:12px;outline:none}
.ptrow .num:focus{border-color:var(--accent)}
.ptcell{display:flex;align-items:center;gap:7px;min-width:0}
.ptcell .sw{width:18px;height:18px;border-radius:3px;border:1px solid var(--line2);flex:none}
.ptcell .hx{font-family:var(--mono);font-size:11.5px;color:var(--text2);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptrow .tolsel{height:28px;background:var(--field);border:1px solid #3C3C3C;border-radius:4px;
  font-size:11.5px;color:var(--text);padding:0 4px;outline:none;width:100%;text-align:center}
.req{height:28px;border-radius:4px;font-size:11px;width:100%;border:1px solid transparent}
.req.must{background:var(--infoS);color:var(--info);border-color:#2C4054}
.req.neg{background:var(--badS);color:var(--bad);border-color:#54303A}
.del{color:var(--disabled);font-size:14px;width:26px;height:26px;border-radius:4px}
.del:hover{background:var(--badS);color:var(--bad)}
.ptfoot{display:flex;gap:8px;align-items:center;padding:8px;background:#252525}
.ptfoot .note{font-size:11px;color:var(--text3);margin-left:auto}

/* 页脚 */
.dlgfoot{display:flex;align-items:center;gap:8px;padding:14px 26px;flex:none}
.dlgfoot .st{font-size:11.5px;color:var(--text3);margin-right:auto;
  display:flex;align-items:center;gap:8px;min-width:0}
.dlgfoot .st .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.dlgfoot .st b{font-weight:400;font-family:var(--mono);color:var(--text2)}
.dlgfoot .st.idle .dot{background:#555}

/* 运行结果条 */
.runbar{margin:0 26px 12px;padding:8px 12px;border-radius:6px;background:var(--okS);
  border:1px solid #2F5238;display:none;gap:10px;align-items:center;font-size:11.5px;
  color:#CFE9CF}
.runbar.show{display:flex}
.runbar.bad{background:var(--badS);border-color:#5A3138;color:#F3CDD2}
.runbar .k{font-family:var(--mono);color:#fff;font-size:11.5px}
.runbar .x{margin-left:auto;color:#9BBE9B;font-family:var(--mono)}

/* 右侧说明 */
.notes{
  width:310px;flex:none;height:100%;overflow:auto;padding:18px 18px 40px;
  border-left:1px solid var(--line);background:#171717;
}
.notes h4{margin:0 0 3px;font-size:12px;font-weight:600;color:var(--text)}
.notes .lead{font-size:11.5px;color:var(--text3);margin:0 0 14px;line-height:1.65}
.nt{margin-bottom:15px;padding-left:26px;position:relative}
.nt .pin{position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;
  background:var(--badS);color:var(--bad);font-size:10.5px;display:grid;place-items:center;
  font-family:var(--mono);border:1px solid #54303A}
.nt.good .pin{background:var(--okS);color:var(--ok);border-color:#2F5238}
.nt h5{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--text)}
.nt p{margin:0;font-size:11.5px;line-height:1.65;color:var(--text3)}
.nt code{font-family:var(--mono);font-size:10.5px;color:var(--text2);background:#242424;
  padding:0 3px;border-radius:3px}
.nt .src{display:block;margin-top:5px;font-family:var(--mono);font-size:10px;color:#6E6E6E}
.divider{height:1px;background:var(--line);margin:18px 0}

/* 改前视图 */
.before-note{background:var(--badS);border:1px solid #54303A;border-radius:6px;
  padding:10px 12px;font-size:11.5px;line-height:1.6;color:#F3CDD2;margin-bottom:14px}
.flat{display:grid;gap:0}
.ff{padding:11px 0;border-bottom:1px solid #2B2B2B;position:relative}
.ff:last-child{border-bottom:none}
.ff .lbl{margin-bottom:5px}
.ff .hint{margin-top:4px}
.ff.flagged{padding-left:24px;border-left:2px solid var(--bad)}
.ff .flag{position:absolute;left:2px;top:12px;width:16px;height:16px;border-radius:50%;
  background:var(--bad);color:#24080C;font-size:9.5px;font-weight:700;display:grid;
  place-items:center;font-family:var(--mono)}
.empty-state{padding:64px 0 30px;text-align:center;color:var(--text3);font-size:12px}
.empty-state .big{font-size:13px;color:var(--text2);margin-bottom:6px}
.recipe{margin-top:14px;text-align:left;background:#202020;border:1px solid var(--line);
  border-radius:6px;padding:10px 12px;font-size:11.5px;color:var(--text3);line-height:1.8}
.recipe b{color:var(--text2);font-weight:600}
.recipe ol{margin:6px 0 0;padding-left:18px}

@media (max-width:1360px){ .notes{display:none} }
@media (max-width:1080px){ .rail{width:60px} .rail .item .k,.rail h4{display:none} }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="drop"></span>鲸灵 · 找色动作族</div>
  <div class="sub">编辑页样板 · 基于真实弹窗结构与 ActionSemantics.json</div>
  <div class="spacer"></div>
  <div class="seg" id="modeSeg">
    <button data-mode="after" aria-selected="true">改后</button>
    <button data-mode="before" aria-selected="false">改前</button>
  </div>
</div>

<div class="shell">
  <nav class="rail">
    <h4>视觉动作</h4>
    <div id="railList"></div>
  </nav>

  <main class="stage">
    <div class="dlg">
      <div class="titlebar">
        <span class="drop"></span><span>编辑动作</span>
        <span class="spacer"></span>
        <button class="wbtn">─</button>
        <button class="wbtn">▢</button>
        <button class="wbtn close">✕</button>
      </div>
      <div class="dlgbody">
        <h1 id="dlgTitle"></h1>
        <p class="desc" id="dlgDesc"></p>
        <div class="tabs" id="dlgTabs">
          <button class="tab" data-tab="basic" aria-selected="true">基础设置</button>
          <button class="tab" data-tab="exec" aria-selected="false">执行与容错<span class="cnt" id="execCnt"></span></button>
          <button class="tab" data-tab="other" aria-selected="false">高级</button>
        </div>
        <div class="panel" id="panel"></div>
      </div>
      <div class="runbar" id="runbar"></div>
      <div class="dlgfoot">
        <div class="st idle" id="status"><span class="dot"></span><span id="statusText">尚未运行</span></div>
        <button class="btn" id="runBtn">运行</button>
        <button class="btn">取消</button>
        <button class="btn primary">保存步骤</button>
      </div>
    </div>
  </main>

  <aside class="notes" id="notes"></aside>
</div>

<script>
// ---------------------------------------------------------------- 动作定义
const A = {
  getPixel: {
    name: '取色', tag: '读取', tagClass: 'read', key: 'vision.getPixel',
    desc: '读取一个点的颜色，只把颜色交回来，不判断它是什么。',
    where: 'point', color: false,
    returns: [['color', '#RRGGBB 文本', '主结果', true], ['number', '整数颜色值', '', true]]
  },
  matchColor: {
    name: '比色', tag: '是 / 否', tagClass: 'bool', key: 'vision.matchColor', isNew: true,
    desc: '判断一个点现在的颜色是不是这个颜色，立即给出是或否。',
    where: 'point', color: true, neg: true,

  if (ms === 0) return '0';

}

function planText() {
  const e = E();
  if (e.retry <= 0) {
    return `<div class="plan idle">不重试：一次失败就按下面的「失败时」处理。</div>`;
  }
  const steps = [];
  if (e.backoff === 'jitter') {
    const lo = Math.round(e.retryDelay * 0.5), hi = Math.round(e.retryDelay * 1.5);
    steps.push(`每次约 ${fmt(lo)}–${fmt(hi)}`);
    return `<div class="plan">最多再试 ${e.retry} 次：${steps[0]}，合计 ${fmt(lo * e.retry)}–${fmt(hi * e.retry)}后放弃。</div>`;
  }
  let total = 0;
  for (let i = 1; i <= e.retry; i++) {
    const g = e.backoff === 'doubling' ? e.retryDelay * Math.pow(2, i - 1) : e.retryDelay;
    total += g;
    steps.push(fmt(g));
  }
  return `<div class="plan">最多再试 ${e.retry} 次：间隔 ${steps.join(' → ')}，合计 ${fmt(total)}后放弃。</div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-act]');
  if (!t) return;

  if (t.dataset.act) { S.act = t.dataset.act; S.tab = 'basic'; S.ran = false; paint(); return; }

  if (t.dataset.mode) {
    S.mode = t.dataset.mode;
    document.querySelectorAll('#modeSeg button').forEach(b =>
      b.setAttribute('aria-selected', b.dataset.mode === S.mode));
    paint(); return;
  }

  if (t.classList.contains('tab')) {
    S.tab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(b =>
      b.setAttribute('aria-selected', b.dataset.tab === S.tab));
    paint(); return;
  }

  if (t.dataset.basis) { D().basis = t.dataset.basis; paint(); return; }

  if (t.dataset.onerror) { E().onError = t.dataset.onerror; paint(); return; }

  if (t.dataset.miss) { D().miss = t.dataset.miss; paint(); return; }

  if (t.dataset.region === 'full') {
    D().region = [0, 0, 1920, 1080]; paint(); return;
  }
  if (t.dataset.region === 'pick') {
    D().region = [880, 480, 240, 160]; paint(); return;
  }

  if (t.dataset.ptAdd !== undefined) {
    D().points.push({ dx: 0, dy: 0, color: '#FFFFFF', tol: 5, neg: false });
    paint(); return;
  }
  if (t.dataset.ptClear !== undefined) { D().points = []; paint(); return; }
  if (t.dataset.ptDel !== undefined) {
    D().points.splice(+t.dataset.ptDel, 1); paint(); return;
  }
  if (t.dataset.ptNeg !== undefined) {
    const p = D().points[+t.dataset.ptNeg]; p.neg = !p.neg; paint(); return;
  }

  if (t.id === 'runBtn') { run(); return; }
});

document.addEventListener('change', e => {
  const el = e.target;

    const k = el.dataset.e;

    if (k === 'frame') D().frame = v; else E()[k] = v;

});

    if (sw) sw.style.background = el.value;
  }
  if (el.dataset.f === 'order') d.order = el.value;
  if (el.dataset.f === 'x') d.x = +el.value || 0;
  if (el.dataset.f === 'y') d.y = +el.value || 0;
  if (el.dataset.r !== undefined) {
    d.region[+el.dataset.r] = +el.value || 0;
    const note = el.closest('.blk').querySelector('[data-area]');
    if (note) {
      const [w, h] = [d.region[2], d.region[3]];
      note.textContent = `${w}×${h} · ${(w * h / 1e6).toFixed(2)} 百万像素`;
    }
  }
  if (el.dataset.pt !== undefined) {
    const p = d.points[+el.dataset.pt];
    const k = el.dataset.k;
    if (k === 'dx' || k === 'dy') p[k] = parseInt(el.value, 10) || 0;
    if (k === 'tol') p.tol = +el.value;
  }
});

// ---------------------------------------------------------------- 运行
const RESULTS = {
  getPixel:  { ok: true,  text: () => `<b>#E24C41</b> · 颜色数值 <b>4289601</b> · 用时 <b>2 ms</b>` },
  matchColor:{ ok: true,  text: () => `匹配 · 实测 <b>#E24C41</b> · 偏差 <b>2.1%</b> · 容差 5% · 用时 <b>3 ms</b>` },
  waitColor: { ok: true,  text: () => `已等到 · 实测 <b>#E24C41</b> · 等了 <b>340 ms</b>` },
  findColor: { ok: true,  text: d => `找到 1 处 · <b>(${d.region[0] + 300}, ${d.region[1] + 200})</b> · 偏差 <b>2.1%</b> · 用时 <b>11 ms</b>` },
  findColors:{ ok: true,  text: d => `找到 1 处 · <b>(${d.region[0] + 300}, ${d.region[1] + 200})</b> · ${d.points.filter(p => !p.neg).length}/${d.points.filter(p => !p.neg).length} 点全中 · 用时 <b>9 ms</b>` }
};

function run() {
  const d = D(), r = RESULTS[S.act];
  setStatus('运行中…');
  const bar = document.getElementById('runbar');
  setTimeout(() => {
    bar.className = 'runbar show' + (r.ok ? '' : ' bad');
    bar.innerHTML = `<span>${r.ok ? '✓' : '✕'}</span><span>${r.text(d)}</span>
      <span class="x">${A[S.act].key}</span>`;
    setStatus('上一次运行成功', 'ok');
  }, 420);
}

paint();

// 支持 #act=findColors&mode=before&tab=other 直开某个状态，方便评审时发链接
(function () {
  const q = new URLSearchParams(location.hash.slice(1));
  const act = q.get('act'), mode = q.get('mode'), tab = q.get('tab');
  if (act && A[act]) S.act = act;
  if (mode === 'before' || mode === 'after') S.mode = mode;
  if (tab === 'basic' || tab === 'exec' || tab === 'other') S.tab = tab;
  document.querySelectorAll('#modeSeg button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.mode === S.mode));
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  paint();
})();
</script>
